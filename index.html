<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uAsset有谱 · 个人资产记账与组合追踪</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light dark;--fg:#1c1e21;--fg-soft:#55585d;--line:#e3e5e8;--bg:#fff;--card:#f6f7f8;--accent:#0a7d8c}
@media (prefers-color-scheme:dark){:root{--fg:#e8eaed;--fg-soft:#9aa0a6;--line:#33363a;--bg:#17181a;--card:#1f2124;--accent:#4fc3d1}}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
main{max-width:680px;margin:0 auto;padding:64px 20px 48px}
.brand{font-size:13px;letter-spacing:.14em;color:var(--accent);font-weight:600}
h1{font-size:30px;line-height:1.3;margin:10px 0 8px}
.tagline{font-size:16px;color:var(--fg-soft);margin:0 0 36px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.tile{display:block;padding:18px 20px;background:var(--card);border-radius:14px;text-decoration:none}
.tile strong{display:block;font-size:15px;color:var(--fg);margin-bottom:4px}
.tile span{font-size:13px;color:var(--fg-soft)}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--fg-soft);text-align:center}
a{color:var(--accent)}
</style>
</head>
<body>
<main>

<div class="brand">UASSET有谱</div>
<h1>uAsset有谱</h1>
<p class="tagline">个人资产记账与组合追踪</p>

<div class="grid">
<a class="tile" href="/privacy"><strong>隐私政策</strong><span>数据最小化：账本只存你的设备，服务端不留存</span></a>
<a class="tile" href="/terms"><strong>用户协议</strong><span>使用条款与免责说明</span></a>
</div>

<footer>
<div>© 2026 uAsset有谱</div>
</footer>

</main>
</body>
</html>
